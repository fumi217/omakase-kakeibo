# ローカル開発環境（Node.js 22 = Lambda nodejs22.x と同じメジャーバージョン）
# 起動: docker compose up
services:
  backend:
    build: ./backend
    command: ["node", "--watch", "local/server.js"]
    ports:
      - "3000:3000"
    # トークン類は backend にだけ渡す。.env がなくても起動できる
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build: ./frontend
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    # 画面側には VITE_ で始まる値だけを渡す（.env のトークンはコンテナにも入れない）
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
      VITE_LIFF_ID: ${VITE_LIFF_ID:-}
      VITE_LIFF_MOCK: ${VITE_LIFF_MOCK:-true}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

# node_modules はホスト（macOS / Windows）とコンテナ（Linux）で共有しない
volumes:
  backend_node_modules:
  frontend_node_modules:
