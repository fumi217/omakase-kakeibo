<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 780" width="1440" height="780" role="img" aria-labelledby="ttl desc" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
<title id="ttl">おまかせ家計簿のシステム構成</title>
<desc id="desc">利用者は LINE の公式アカウントとミニアプリを使う。公式アカウントは Webhook で AWS Lambda の Backend を呼ぶ。ミニアプリは Amplify Hosting の Frontend から開き、Frontend は Backend の API を呼ぶ。Backend は共通の集計を通して、sunabar（銀行 API のサンドボックス）と自作 API からデータを集める。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
